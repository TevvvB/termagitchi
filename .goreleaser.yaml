version: 2

project_name: termagitchi

before:
  hooks:
    - go mod tidy

builds:
  - id: pets
    main: ./cmd/pets
    binary: pets
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishing to a tap needs the TevvvB/homebrew-tap repository to exist and a
# TAP_GITHUB_TOKEN secret to push with. Until both are in place these are
# skipped, so a tag still produces working GitHub Release binaries rather than
# failing the whole release on a missing repo.
homebrew_casks:
  - name: termagitchi
    skip_upload: "true"
    repository:
      owner: TevvvB
      name: homebrew-tap
    homepage: https://github.com/TevvvB/termagitchi
    description: A creature for every worktree, in your agent's status line
    license: MIT
    binaries:
      - pets
    hooks:
      post:
        # Homebrew quarantines cask payloads, and an unsigned binary then fails
        # Gatekeeper on first run. Formulas did not need this; casks do.
        install: |
          system_command "/usr/bin/xattr",
                         args: ["-dr", "com.apple.quarantine", "#{staged_path}/pets"],
                         must_succeed: false

scoops:
  - skip_upload: "true"
    repository:
      owner: TevvvB
      name: scoop-bucket
    homepage: https://github.com/TevvvB/termagitchi
    description: A creature for every worktree, in your agent's status line
    license: MIT
